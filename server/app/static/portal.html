<style>
/* Palette A, the same values as lib/ui/theme.dart. */
:root{--ground:#F4F5F7;--surface:#FFFFFF;--sunk:#EBEDF1;--ink:#15171C;--muted:#555C69;--line:#DFE2E8;
--accent:#2F5BEA;--on-accent:#FFFFFF;--accent-soft:#E6ECFD;--warn-soft:#FDF0DC;--warn-ink:#7A4A05;
--ok-soft:#DDF3E8;--ok-ink:#0F5A37;--ok:#047857;--on-ok:#FFFFFF;--danger:#B42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ground:#0F1115;--surface:#181B21;--sunk:#1F232A;--ink:#ECEEF2;--muted:#A0A7B3;
--line:#2A2F38;--accent:#7C9BFF;--on-accent:#0B1020;--accent-soft:#1E2A4D;--warn-soft:#3A2A12;--warn-ink:#F8C77E;
--ok-soft:#133526;--ok-ink:#7FDDB0;--ok:#34D399;--on-ok:#052E1F;--danger:#F97066;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 Heebo,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:60px}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-size:15px}.brand span{font-size:12px;color:var(--muted)}
.icon-btn{min-width:44px;min-height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:10px}
.lang{margin-inline-start:auto;border:1px solid var(--line);background:transparent;border-radius:99px;min-width:48px;min-height:36px;font-size:13px;font-weight:500}
main .wrap{padding:16px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{border:0;border-radius:9px;min-height:44px;background:transparent;color:var(--muted);font-size:14px}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.order{display:flex;gap:12px;align-items:center;padding:12px;text-align:start;width:100%}
.thumb{flex:none;width:72px;height:72px;border-radius:10px;background:var(--sunk);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:66px;height:66px;object-fit:contain}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.muted{color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.waiting{background:var(--warn-soft);color:var(--warn-ink)}
.chip.done{background:var(--ok-soft);color:var(--ok-ink)}
.row{display:flex;align-items:center;gap:8px}
.ltr{direction:ltr;unicode-bidi:isolate}
.stage{position:relative;background:var(--sunk);border-radius:14px;height:min(62vh,420px);overflow:hidden;touch-action:none}
.stage canvas{width:100%;height:100%;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage.picking{outline:3px solid var(--accent);outline-offset:-3px;cursor:crosshair}
.pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--accent);color:var(--on-accent);
font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #FFFFFF;pointer-events:none;left:0;top:0}
.pin.new{background:var(--ok);color:var(--on-ok)}
.overlay{position:absolute;inset:0;pointer-events:none}
.hint{position:absolute;bottom:10px;inset-inline-start:10px;font-size:12px;background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 10px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.vers{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vers button{border:1px solid var(--line);background:transparent;border-radius:8px;min-height:36px;padding:0 12px;font-size:13px}
.vers button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);font-weight:500}
.pick{border:1px solid var(--accent);background:transparent;border-radius:10px;min-height:44px;padding:0 14px;font-weight:500;display:flex;gap:6px;align-items:center}
.pick[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
section.card{padding:16px;display:flex;flex-direction:column;gap:8px}
h2{margin:0 0 4px;font-size:16px}
.line{display:flex;justify-content:space-between;gap:8px}
.total{border-top:1px solid var(--line);padding-top:8px;font-weight:700;font-size:17px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sunk);color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.msg .num.p{background:var(--accent);color:var(--on-accent)}
.bubble{flex:1;border-radius:12px;padding:8px 12px;background:var(--sunk);display:flex;flex-direction:column;gap:2px;white-space:pre-wrap;word-break:break-word}
.msg.me .bubble{background:var(--accent-soft)}
.composer{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px;min-height:48px}
.composer input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px}
.send{border:0;background:var(--accent-soft);border-radius:9px;min-height:36px;padding:0 14px;font-weight:500}
.bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:4}
.bar .wrap{display:flex;align-items:center;gap:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.approve{flex:1;border:0;border-radius:12px;min-height:52px;background:var(--ok);color:var(--on-ok);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.approve:disabled{opacity:.6;cursor:default}
.banner{border-radius:12px;padding:12px 14px;background:var(--ok-soft);color:var(--ok-ink);font-weight:500}
[dir=ltr] .chev,[dir=ltr] #back svg{transform:scaleX(-1)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.error{color:var(--danger)}
dialog{border:0;border-radius:16px;background:var(--surface);color:var(--ink);padding:20px;max-width:360px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .row{justify-content:flex-end;margin-top:16px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;min-height:44px;padding:0 16px}
.sk{background:var(--sunk);border-radius:14px;height:96px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
</style>
</head>

  <div class="row"><button class="ghost" id="confirmNo" type="button"></button><button class="approve" id="confirmYes" type="button" style="flex:none;padding:0 18px"></button></div></dialog>

<script type="module">
const T = {
  he: {studio:'סטודיו הדפסה', ordersOf:n=>`ההזמנות של ${n}`, waiting:'ממתין לאישור', approvedTab:'אושר', back:'חזרה לרשימה',
    version:'גרסה', units:'יח׳', updated:'עודכן', now:'עכשיו', versions:'גרסאות:', view2d:'2D', view3d:'3D', asm:'על המיקרופון',
    drag:'גררו ימינה ושמאלה לסיבוב', pin:'הערה על הדגם', pinHint:'לוחצים, ואז מקישים על המקום בדגם', pinTap:'הקישו על המקום בדגם',
    pinSet:'ההערה תוצמד לנקודה', quote:'הצעת מחיר', unitsX:(q,u)=>`${q} יחידות × ${u}`, vat:p=>`מע״מ ${p}%`, total:'סה״כ לתשלום',
    noQuote:'הצעת המחיר עוד בהכנה', prevQuote:(a,d)=>`המחיר עודכן ב-${d} (קודם: ${a})`, approveNote:'האישור מאשר את הגרסה ואת המחיר יחד. אחרי האישור הגרסה ננעלת ועוברת להדפסה.',
    approve:'מאשר/ת עיצוב ומחיר', totalVat:'סה״כ כולל מע״מ', confirmTitle:'לאשר?', confirmText:(v,t,vat)=>`גרסה ${v} במחיר ${t}${vat ? ' כולל מע״מ' : ''}. אחרי האישור אי אפשר לשנות.`,
    yes:'כן, מאשר/ת', no:'ביטול', approvedAt:(v,d)=>`גרסה ${v} אושרה ב-${d}. תודה!`, comments:'הערות', write:'כתבו הערה…', send:'שליחה',
    you:'את/ה', studioName:'סטודיו הדפסה', none:'אין כרגע עיצובים שמחכים לאישור.', noneApproved:'עוד אין עיצובים שאושרו.',
    footer:'הקישור הזה אישי, אין צורך בסיסמה.', gone:'הקישור הזה כבר לא פעיל. בקשו קישור חדש מהסטודיו.',
    failed:'משהו נכשל. בדקו את החיבור ונסו שוב.', changed:'העיצוב או המחיר השתנו. טוענים מחדש…', loading3d:'טוען תלת-ממד…',
    st:{draft:'טיוטה', waiting:'ממתין לאישור', approved:'אושר', printing:'בהדפסה', ready:'מוכן', delivered:'נמסר', paid:'שולם'}},
  en: {studio:'Print Studio', ordersOf:n=>`Orders for ${n}`, waiting:'Awaiting approval', approvedTab:'Approved', back:'Back to the list',
    version:'Version', units:'pcs', updated:'updated', now:'current', versions:'Versions:', view2d:'2D', view3d:'3D', asm:'On the mic',
    drag:'Drag left and right to turn', pin:'Comment on the model', pinHint:'Press, then tap the spot on the model', pinTap:'Tap the spot on the model',
    pinSet:'The comment will be pinned there', quote:'Quote', unitsX:(q,u)=>`${q} pcs × ${u}`, vat:p=>`VAT ${p}%`, total:'Total',
    noQuote:'The quote is being prepared', prevQuote:(a,d)=>`Price updated on ${d} (was ${a})`, approveNote:'Approving accepts this version and this price together. The version is then locked and goes to print.',
    approve:'Approve design and price', totalVat:'Total incl. VAT', confirmTitle:'Approve?', confirmText:(v,t,vat)=>`Version ${v} for ${t}${vat ? ' incl. VAT' : ''}. This can't be changed afterwards.`,
    yes:'Yes, approve', no:'Cancel', approvedAt:(v,d)=>`Version ${v} approved on ${d}. Thank you!`, comments:'Comments', write:'Write a comment…', send:'Send',
    you:'You', studioName:'Print Studio', none:'Nothing is waiting for your approval.', noneApproved:'Nothing approved yet.',
    footer:'This link is personal; no password needed.', gone:'This link is no longer active. Ask the studio for a new one.',
    failed:'Something failed. Check the connection and try again.', changed:'The design or the price changed. Reloading…', loading3d:'Loading 3D…',
    st:{draft:'Draft', waiting:'Awaiting approval', approved:'Approved', printing:'Printing', ready:'Ready', delivered:'Delivered', paid:'Paid'}},
};
const base = location.pathname.replace(/\/$/, '');
const preview = new URLSearchParams(location.search).get('preview') || '';
const $ = id => document.getElementById(id);
let data = null, lang = null, tab = 'waiting', sel = {}, picking = false, draftPin = null, viewer = null;
const t = () => T[lang];

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const shekel = a => '₪' + (a / 100).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const ltr = s => h('span', {class: 'ltr'}, s);
const day = iso => iso ? new Date(iso).toLocaleDateString('he-IL', {day: '2-digit', month: '2-digit'}) : '';
const file = (v, name) => `${base}/f/${v.id}/${name}`;
const has = (v, name) => v.files.includes(name);
// Static markup only, never data: data always goes through h() and textContent.
const icon = markup => { const tpl = document.createElement('template'); tpl.innerHTML = markup; return tpl.content.firstChild; };
const PIN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>';
const CHEVRON = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex:none;color:var(--muted)"><path d="m15 18-6-6 6-6"/></svg>';
const statusClass = s => s === 'waiting' ? 'chip waiting' : (s === 'draft' ? 'chip' : 'chip done');

async function load() {
  const r = await fetch(`${base}/data${preview ? '?preview=' + encodeURIComponent(preview) : ''}`, {cache: 'no-store'});
  if (r.status === 404) throw 'gone';
  if (!r.ok) throw 'failed';
  data = await r.json();
  if (!lang) { try { lang = localStorage.getItem('lang'); } catch {} lang = T[lang] ? lang : (data.customer.lang === 'en' ? 'en' : 'he'); }
}

function route() {
  const rid = new URLSearchParams(location.hash.slice(1)).get('r');
  const req = data && data.requests.find(r => r.id === rid);
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.title = t().studio; $('lang').textContent = lang === 'he' ? 'EN' : 'עב';
  $('lang').setAttribute('aria-label', lang === 'he' ? 'Switch to English' : 'לעבור לעברית');
  if (viewer) { viewer.dispose(); viewer = null; }
  picking = false; draftPin = null;
  req ? detail(req) : list();
  window.scrollTo(0, 0);
}

function list() {
  $('back').hidden = true; $('logo').style.display = ''; $('bar').hidden = true;
  $('title').textContent = t().studio; $('subtitle').textContent = t().ordersOf(data.customer.name);
  const waiting = data.requests.filter(r => r.status === 'waiting'), done = data.requests.filter(r => r.status !== 'waiting');
  if (!waiting.length && done.length && tab === 'waiting' && !sel.tabChosen) tab = 'done';
  const shown = tab === 'waiting' ? waiting : done;
  const seg = h('div', {class: 'seg', role: 'tablist'},
    h('button', {type: 'button', role: 'tab', 'aria-selected': String(tab === 'waiting'), onclick: () => { tab = 'waiting'; sel.tabChosen = true; route(); }}, `${t().waiting} · ${waiting.length}`),
    h('button', {type: 'button', role: 'tab', 'aria-selected': String(tab === 'done'), onclick: () => { tab = 'done'; sel.tabChosen = true; route(); }}, `${t().approvedTab} · ${done.length}`));
  const cards = shown.map(r => {
    const v = r.versions.find(x => x.id === r.currentVersionId) || r.versions[r.versions.length - 1];
    return h('a', {href: `#r=${r.id}`, class: 'card order', style: 'color:inherit;text-decoration:none'},
      h('div', {class: 'thumb'}, has(v, 'preview.png') ? h('img', {src: file(v, 'preview.png'), alt: '', loading: 'lazy'}) : null),
      h('div', {class: 'grow'},
        h('b', {}, r.title),
        h('span', {class: 'muted'}, `${t().version} ${v.n} · ${r.qty} ${t().units} · ${t().updated} `, ltr(day(r.updated))),
        h('div', {class: 'row'}, h('span', {class: statusClass(r.status)}, t().st[r.status] || r.status),
          r.quote ? h('span', {class: 'ltr', style: 'margin-inline-start:auto;font-size:13px'}, shekel(r.quote.total)) : null)),
      icon(CHEVRON));
  });
  $('main').replaceChildren(seg, ...(cards.length ? cards : [h('p', {class: 'empty'}, tab === 'waiting' ? t().none : t().noneApproved)]),
    h('p', {class: 'muted', style: 'text-align:center'}, t().footer));
}

function detail(r) {
  const versionId = sel[r.id] || r.currentVersionId || r.versions[r.versions.length - 1].id;
  const v = r.versions.find(x => x.id === versionId) || r.versions[r.versions.length - 1];
  const views = [['2d', 'preview.png', t().view2d], ['3d', 'spin.jpg', t().view3d], ['asm', 'spin_asm.jpg', t().asm]].filter(([, f]) => has(v, f));
  let view = sel['view' + r.id];
  if (!views.some(([k]) => k === view)) view = views[0] ? views[0][0] : null;
  $('back').hidden = false; $('logo').style.display = 'none';
  $('back').setAttribute('aria-label', t().back);
  $('title').textContent = r.title; $('subtitle').textContent = `${t().version} ${v.n} · ${r.qty} ${t().units}`;

  const pinned = r.comments.filter(c => c.versionId === v.id && c.pin && c.pin.view === view);
  const numbers = new Map(r.comments.filter(c => c.pin).map((c, i) => [c.id, i + 1]));
  const stage = h('div', {class: 'stage' + (picking ? ' picking' : '')});
  const overlay = h('div', {class: 'overlay'});
  const markers = pinned.map(c => ({p: c.pin, el: h('span', {class: 'pin'}, numbers.get(c.id))}));
  if (draftPin && draftPin.view === view) markers.push({p: draftPin, el: h('span', {class: 'pin new'}, '+')});
  overlay.append(...markers.map(m => m.el));

  if (view) {
    const name = views.find(([k]) => k === view)[1];
    stage.append(h('div', {class: 'loading'}, t().loading3d), overlay);
    if (view !== '2d') stage.append(h('span', {class: 'hint'}, t().drag));
    showPictures(stage, file(v, name), view === '2d' ? 1 : SPIN, markers, p => setPin(r, {view, ...p}));
  }

  const kids = [stage];
  if (views.length > 1) kids.unshift(h('div', {class: 'seg', role: 'tablist'}, views.map(([k, , label]) =>
    h('button', {type: 'button', role: 'tab', 'aria-selected': String(k === view), onclick: () => { sel['view' + r.id] = k; draftPin = null; rerender(r); }}, label))));
  const open = r.status === 'waiting';
  if (open && view) kids.push(h('div', {class: 'row'},
    h('button', {type: 'button', class: 'pick', 'aria-pressed': String(picking), onclick: () => { picking = !picking; rerender(r); }},
      icon(PIN), t().pin),
    h('span', {class: 'muted'}, draftPin ? t().pinSet : (picking ? t().pinTap : t().pinHint))));
  if (r.versions.length > 1) kids.push(h('div', {class: 'vers'}, h('span', {class: 'muted'}, t().versions), r.versions.map(x =>
    h('button', {type: 'button', 'aria-pressed': String(x.id === v.id), onclick: () => { sel[r.id] = x.id; draftPin = null; picking = false; rerender(r); }},
      `v${x.n}` + (x.id === r.currentVersionId && r.versions.length > 1 ? ` · ${t().now}` : '')))));
  if (r.approved) kids.push(h('div', {class: 'banner'}, t().approvedAt(r.versions.find(x => x.id === r.approved.versionId)?.n ?? '', day(r.approved.at))));
  else kids.push(h('div', {class: 'row'}, h('span', {class: statusClass(r.status)}, t().st[r.status] || r.status)));

  const q = r.quote;
  kids.push(h('section', {class: 'card'}, h('h2', {}, t().quote), q ? [
    h('div', {class: 'line'}, h('span', {class: 'muted'}, t().unitsX(q.qty, ''), ltr(shekel(q.unit))), ltr(shekel(q.net))),
    q.vatPercent ? h('div', {class: 'line'}, h('span', {class: 'muted'}, t().vat(q.vatPercent)), ltr(shekel(q.vat))) : null,
    h('div', {class: 'line total'}, h('span', {}, t().total), ltr(shekel(q.total))),
    q.note ? h('span', {class: 'muted', style: 'white-space:pre-wrap'}, q.note) : null,
    r.previousQuotes.length ? h('span', {class: 'muted'}, t().prevQuote(shekel(r.previousQuotes[r.previousQuotes.length - 1].total), day(q.at))) : null,
    open ? h('span', {class: 'muted'}, t().approveNote) : null,
  ] : h('span', {class: 'muted'}, t().noQuote)));

  const input = h('input', {type: 'text', placeholder: t().write, 'aria-label': t().write, maxlength: 2000});
  const send = async () => {
    const text = input.value.trim(); if (!text) return;
    input.disabled = true;
    const ok = await post(`requests/${r.id}/comments`, {versionId: v.id, text, pin: draftPin});
    input.disabled = false;
    if (ok) { input.value = ''; draftPin = null; picking = false; await refresh(); }
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  kids.push(h('section', {class: 'card'}, h('h2', {}, t().comments),
    r.comments.map(c => h('div', {class: 'msg' + (c.from === 'client' ? ' me' : '')},
      h('span', {class: 'num' + (c.pin ? ' p' : '')}, c.pin ? numbers.get(c.id) : (c.from === 'client' ? '' : t().studioName[0])),
      h('div', {class: 'bubble'}, h('span', {class: 'muted'}, `${c.from === 'client' ? t().you : t().studioName} · v${c.versionN ?? ''} · `, ltr(day(c.at))), c.text))),
    r.status !== 'paid' && !preview ? h('label', {class: 'composer'}, input, h('button', {type: 'button', class: 'send', onclick: send}, t().send)) : null));
  $('main').replaceChildren(...kids);

  const canApprove = open && q && v.id === r.currentVersionId && !preview;
  $('bar').hidden = !canApprove;
  if (canApprove) {
    $('barLabel').textContent = q.vatPercent ? t().totalVat : t().total; $('barTotal').textContent = shekel(q.total);
    $('approve').querySelector('span').textContent = t().approve;
    $('approve').onclick = () => confirmApprove(r, v, q);
  }
  if (picking) setTimeout(() => stage.scrollIntoView({block: 'nearest', behavior: 'smooth'}), 0);
}

function setPin(r, p) { draftPin = p; picking = false; rerender(r); }
function rerender(r) { if (viewer) { viewer.dispose(); viewer = null; } detail(data.requests.find(x => x.id === r.id)); }

function confirmApprove(r, v, q) {
  const d = $('confirm');
  $('confirmTitle').textContent = t().confirmTitle; $('confirmText').textContent = t().confirmText(v.n, shekel(q.total), q.vatPercent > 0);
  $('confirmNo').textContent = t().no; $('confirmYes').textContent = t().yes;
  $('confirmNo').onclick = () => d.close();
  $('confirmYes').onclick = async () => {
    $('confirmYes').disabled = true;
    const ok = await post(`requests/${r.id}/approve`, {versionId: v.id, quoteId: q.id});
    $('confirmYes').disabled = false; d.close();
    if (ok) await refresh();
  };
  d.showModal();
}

async function post(path, body) {
  try {
    const res = await fetch(`${base}/${path}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (res.status === 409) { alertBox(t().changed); await refresh(); return false; }
    if (!res.ok) throw new Error(res.status);
    return true;
  } catch { alertBox(t().failed); return false; }
}
function alertBox(text) { const p = h('p', {class: 'error', role: 'alert'}, text); $('main').prepend(p); setTimeout(() => p.remove(), 6000); }
async function refresh() { try { await load(); } catch (e) { return fail(e); } route(); }
function fail(e) {
  $('bar').hidden = true;
  $('main').replaceChildren(h('p', {class: 'empty'}, e === 'gone' ? T[lang || 'he'].gone : T[lang || 'he'].failed));
}

// The views are pictures drawn on a canvas: the 2D image, or a sheet of 36 turns
// (10 degrees apart, 6 x 6 tiles) for 3D. No mesh ever reaches the browser.
// A pin is {x, y} on the picture plus z = the turn it was placed on.
const SPIN = 36, GRID = 6, frames = new Map();
function showPictures(stage, url, count, markers, onPick) {
  const canvas = h('canvas', {'aria-hidden': 'true'}), ctx = canvas.getContext('2d');
  stage.prepend(canvas);
  let alive = true, frame = 0, img = null, box = null, down = null;
  const draw = () => {
    if (!alive || !img) return;
    const W = stage.clientWidth, H = stage.clientHeight, dpr = Math.min(devicePixelRatio, 2);
    canvas.width = W * dpr; canvas.height = H * dpr;
    const grid = count > 1 ? GRID : 1, tw = img.naturalWidth / grid, th = img.naturalHeight / grid;
    const s = Math.min(W / tw, H / th), w = tw * s, hh = th * s, ox = (W - w) / 2, oy = (H - hh) / 2;
    box = {ox, oy, w, hh};
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.drawImage(img, (frame % grid) * tw, Math.floor(frame / grid) * th, tw, th, ox, oy, w, hh);
    for (const m of markers) {
      m.el.style.transform = `translate(${ox + m.p.x * w}px,${oy + m.p.y * hh}px)`;
      m.el.style.opacity = count === 1 || Math.round(m.p.z) === frame ? '1' : '0';
    }
  };
  const ro = new ResizeObserver(draw); ro.observe(stage);
  viewer = {dispose() { alive = false; ro.disconnect(); }};
  stage.addEventListener('contextmenu', e => e.preventDefault());
  stage.addEventListener('dragstart', e => e.preventDefault());
  if (!frames.has(url)) frames.set(url, new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; }));
  frames.get(url).then(i => { if (!alive) return; img = i; stage.querySelector('.loading')?.remove(); draw(); },
    () => { if (alive) stage.querySelector('.loading').textContent = t().failed; });
  // Jump to the turn of a pin that is being placed or shown, so it is visible.
  const first = markers.find(m => m.el.classList.contains('new')) || markers[0];
  if (count > 1 && first) frame = Math.round(first.p.z) % count;
  stage.addEventListener('pointerdown', e => { down = {x: e.clientX, y: e.clientY, frame, moved: false}; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => {
    if (!down || count === 1) return;
    const dx = e.clientX - down.x;
    if (Math.abs(dx) > 6) down.moved = true;
    const next = ((down.frame - Math.round(dx / 10)) % count + count) % count;
    if (next !== frame) { frame = next; draw(); }
  });
  stage.addEventListener('pointerup', e => {
    const d = down; down = null;
    if (!picking || !d || d.moved || !box) return; // a drag turns, only a tap pins
    const b = stage.getBoundingClientRect(), x = (e.clientX - b.left - box.ox) / box.w, y = (e.clientY - b.top - box.oy) / box.hh;
    if (x >= 0 && x <= 1 && y >= 0 && y <= 1) onPick({x, y, z: frame});
  });
}

$('back').onclick = () => { location.hash = ''; };
$('lang').onclick = () => { lang = lang === 'he' ? 'en' : 'he'; try { localStorage.setItem('lang', lang); } catch {} route(); };
addEventListener('hashchange', route);
load().then(route, fail);
</script>
</body>
</html>
