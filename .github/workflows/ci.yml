name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - working-directory: firestore-tests
        run: |
          npm ci
          npx --yes firebase-tools@15.15.0 emulators:exec --only firestore --project demo-print-studio --config ../firebase.json \
            "node --test --test-concurrency=1 rules.test.mjs"

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # C-4: the Flag Maker's own crm_link.py against this server (test_flagmaker_client.py). Private repo:
      # CROSS_REPO_TOKEN (README › Cross-repo checks); without it that test is skipped.
      - name: Flag Maker checkout
        if: env.CROSS_REPO_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: alex99ka/interview-flag-maker
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: flag-maker
          sparse-checkout: app/crm_link.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: pip install -r requirements-dev.txt
      # studio.py's tests need Firestore: the emulator, as for the rules.
      - run: |
          npx --yes firebase-tools@15.15.0 emulators:exec --only firestore --project demo-print-studio --config ../firebase.json "pytest -q -rs"
        env:
          FLAG_MAKER_APP: ${{ github.workspace }}/flag-maker/app
